name: Supabase migrations

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - "server/db/**"
      - ".github/workflows/supabase-migrations.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "server/db/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate clean migration chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Rebuild local database from migrations
        run: supabase db reset

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  deploy-production:
    name: Deploy migrations to production
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: uoxoljiucezwdpqfnuga
    steps:
      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production migration deployment skipped. Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD under GitHub Settings > Secrets and variables > Actions."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: steps.credentials.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        if: steps.credentials.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Reconcile the pre-existing production baseline
        if: steps.credentials.outputs.ready == 'true'
        run: supabase migration repair --status applied 20261115000000 --linked

      - name: Apply pending production migrations
        if: steps.credentials.outputs.ready == 'true'
        run: supabase db push --linked --yes
